name: S26 v106 - RADV clarity experimental signed

on:
  push:
    branches:
      - feature/s26-v106-radv19-claridad-streaming
    paths:
      - .github/workflows/s26-v106-radv19-signed.yml
      - os/android/app/build.gradle.kts
      - os/android/app/src/main/java/com/libertyrecomp/**
      - os/android/app/src/test/java/com/libertyrecomp/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s26-v106-radv19-signed
  cancel-in-progress: true

jobs:
  build:
    name: Verify and sign experimental v106 over verified v105 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout v106 source
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Check package, version and sustained mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('os/android/app/build.gradle.kts').read_text()
          pkg=re.search(r'applicationId\s*=\s*"([^"]+)"',text).group(1)
          code=int(re.search(r'versionCode\s*=\s*(\d+)',text).group(1))
          assert (pkg,code)==('com.kasoncubillos.xhynivs26stable',106),(pkg,code)
          profiles=Path('os/android/app/src/main/java/com/libertyrecomp/S26GraphicsProfiles.java').read_text()
          ui=Path('os/android/app/src/main/java/com/libertyrecomp/MobileSettingsUi.java').read_text()
          assert 'case SUSTAINED_60:' in profiles
          assert 'audio_maxqframes", "32"' in profiles
          assert 'audio_adaptive_buffer", "true"' in profiles
          assert 'audio_low_latency", "false"' in profiles
          assert 'case SUSTAINED_60_CITY:' in profiles
          assert 'applyForDriver' in profiles
          assert 'gta4_dynamic_draw_distance", "false"' in profiles
          assert 'S26 60 FPS sostenidos' in ui
          assert 'S26 60 FPS sostenidos' in ui
          assert 'S26 sesión larga · audio estable' not in ui
          assert Path('os/android/app/src/main/java/com/libertyrecomp/CheatsUi.java').exists()
          assert Path('os/android/app/src/main/java/com/libertyrecomp/PhoneScriptExport.java').exists()
          print('Stable update identity, existing mode, existing MOD cheats and diagnostics preserved')
          PY

      - name: Java 17 for Android tests and release tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and native-compatible pinned SDL3
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools and pinned SDL3 Java
        run: |
          set -euo pipefail
          sdkmanager --licenses >/dev/null <<<'y' || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          git submodule update --init glue/rexglue-sdk-main/thirdparty/sdl3
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download pinned working v105 ARM64 baseline and prior v102
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/baseline out/old
          gh release download s26-sostenido-audio-v105 --repo "$GITHUB_REPOSITORY" \
            --pattern XHYN-IV-S26-sostenido-audio-v105.apk --dir out/baseline
          echo "fa794e33de2ddbe707debe7a3d4c080c5133880cc3601abfdca9000de179063d  out/baseline/XHYN-IV-S26-sostenido-audio-v105.apk" | sha256sum -c -
          gh release download s26-update-v102 --repo "$GITHUB_REPOSITORY" \
            --pattern XHYN-IV-S26-update-v102.apk --dir out/old
          test -s out/old/XHYN-IV-S26-update-v102.apk

      - name: Run Android unit and MOD menu regressions
        working-directory: os/android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Build aligned Java update with exact v105 ARM64 libraries
        run: |
          set -euo pipefail
          python3 os/android/scripts/package_release.py \
            --native-apk out/baseline/XHYN-IV-S26-sostenido-audio-v105.apk \
            --native-apk-sha256 fa794e33de2ddbe707debe7a3d4c080c5133880cc3601abfdca9000de179063d \
            --unsigned --output out/XHYN-IV-S26-v106-unsigned.apk

      - name: Sign with unchanged private permanent certificate
        env:
          KEYSTORE_B64: ${{ secrets.XHYN_S26_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XHYN_S26_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Permanent signing secrets unavailable; release intentionally blocked."
            exit 1
          fi
          KS="$RUNNER_TEMP/xhyn-s26-stable.p12"
          PASS="$RUNNER_TEMP/xhyn-s26-stable-pass.txt"
          trap 'rm -f "$KS" "$PASS"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          printf '%s' "$KEYSTORE_PASSWORD" > "$PASS"
          chmod 600 "$KS" "$PASS"
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sign \
            --ks "$KS" --ks-key-alias xhyn-s26-stable \
            --ks-pass "file:$PASS" --v4-signing-enabled false \
            --out out/XHYN-IV-S26-radv19-claridad-v106.apk \
            out/XHYN-IV-S26-v106-unsigned.apk
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify \
            --verbose --print-certs out/XHYN-IV-S26-radv19-claridad-v106.apk > out/new-certificate.txt
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify \
            --verbose --print-certs out/baseline/XHYN-IV-S26-sostenido-audio-v105.apk > out/v105-certificate.txt
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify \
            --verbose --print-certs out/old/XHYN-IV-S26-update-v102.apk > out/v102-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/XHYN-IV-S26-radv19-claridad-v106.apk > out/new-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/baseline/XHYN-IV-S26-sostenido-audio-v105.apk > out/v105-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/old/XHYN-IV-S26-update-v102.apk > out/v102-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 out/XHYN-IV-S26-radv19-claridad-v106.apk

      - name: Verify certificate, update sequence and byte-identical game libraries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import zipfile
          def cert(path):
              hits=re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)',Path(path).read_text())
              assert len(hits)==1,hits
              return hits[0].lower()
          known='fff28171a1b0de6014e7339b6872c672fb14b0cd408e5b15c6732bf70bf599d7'
          assert {cert('out/v102-certificate.txt'),cert('out/v105-certificate.txt'),cert('out/new-certificate.txt')}=={known}
          def identity(path):
              hits=re.search(r"package: name='([^']+)' versionCode='(\d+)'",Path(path).read_text())
              assert hits,path
              return hits.group(1),int(hits.group(2))
          pkg='com.kasoncubillos.xhynivs26stable'
          assert identity('out/v102-badging.txt')==(pkg,102)
          assert identity('out/v105-badging.txt')==(pkg,105)
          assert identity('out/new-badging.txt')==(pkg,106)
          baseline='out/baseline/XHYN-IV-S26-sostenido-audio-v105.apk'
          signed='out/XHYN-IV-S26-radv19-claridad-v106.apk'
          with zipfile.ZipFile(baseline) as old,zipfile.ZipFile(signed) as new:
              original={n for n in old.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')}
              update={n for n in new.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')}
              assert len(original)>=10 and original==update,(len(original),len(update))
              for name in sorted(original):
                  assert hashlib.sha256(old.read(name)).digest()==hashlib.sha256(new.read(name)).digest(),name
              assert any('classes.dex' in name for name in new.namelist())
              code=b''.join(new.read(n) for n in new.namelist() if n.endswith('.dex'))
              assert b'CheatsUi' in code and b'nativeQueueCheat' in code
          print('Update v106 signed with same cert as v102/v105; native motor, MOD cheats and user data path preserved')
          PY
          sha256sum out/XHYN-IV-S26-radv19-claridad-v106.apk > out/XHYN-IV-S26-v106-SHA256.txt

      - name: Keep verified installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-S26-v106-radv19-claridad-signed
          path: |
            out/XHYN-IV-S26-radv19-claridad-v106.apk
            out/XHYN-IV-S26-v106-SHA256.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Publish v106 opt-in RADV experiment without overwriting old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=s26-radv19-claridad-v106
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusal to overwrite published installer."
            exit 1
          fi
          cat > out/v106-notes.md <<'EOF'
          XHYN IV S26 v106 — ensayo voluntario en el modo «60 FPS sostenidos»
          para el controlador RADV Xclipse 1.9 importado por el propietario.
          El conductor debe seleccionarlo manualmente; esta APK NO instala ni
          cambia controladores. Al pulsar el modo sostenido en Gráficos, si está
          seleccionado un RADV Xclipse personalizado, aplica una distancia fija
          de 1.05x, un FSR menos suave y reduce sombras/AA para compensar.
          El modo deja de imponer ajustes de energía de Android y restaura la
          cola de audio de 32, tras el empeoramiento observado en v105.

          El juego y sus bibliotecas ARM64 y menú MOD se conservan idénticos a
          la v105. La firma permanente permite instalar encima de v105 sin
          desinstalar ni borrar partidas. Código de versión 106.

          AVISO: es un experimento no validado físicamente. RADV Xclipse 1.9
          presentó artefactos de interfaz/minimapa y puede fallar o consumir más
          al mantener más ciudad visible. Volver a System Driver en caso
          de artefactos, cuelgues, calor o batería excesivos. No se garantiza
          60 FPS ni streaming más rápido de los modelos.
          EOF
          gh release create "$TAG" \
            out/XHYN-IV-S26-radv19-claridad-v106.apk out/XHYN-IV-S26-v106-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "XHYN IV S26 v106 - RADV 1.9 experimental clarity" \
            --prerelease --notes-file out/v106-notes.md
          echo "APK directa: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/XHYN-IV-S26-radv19-claridad-v106.apk" >> "$GITHUB_STEP_SUMMARY"
