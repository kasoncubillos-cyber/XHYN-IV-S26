name: S26 Beta3 Luces y Trafico APK

on:
  push:
    branches:
      - feature/s26-beta3-luces-trafico
    paths:
      - .github/workflows/s26-beta3-luces-trafico.yml
      - os/android/app/build.gradle.kts
      - os/android/app/src/main/res/values/strings.xml
      - os/android/app/src/main/java/com/libertyrecomp/**
      - os/android/app/src/test/java/com/libertyrecomp/**
      - os/android/scripts/env.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s26-beta3-apk
  cancel-in-progress: true

jobs:
  beta:
    name: Validate, sign and publish Beta3 APK using verified Alpha1 engine
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools and pinned SDL3 Java sources
        run: |
          set -euo pipefail
          sdkmanager --licenses >/dev/null <<<'y' || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          git submodule update --init glue/rexglue-sdk-main/thirdparty/sdl3
          test -d glue/rexglue-sdk-main/thirdparty/sdl3/android-project/app/src/main/java
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download and verify stable Alpha1 native baseline
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/s26-alpha1/XHYN-IV-S26-Alpha1-signed.apk" \
            -o out/baseline-alpha1.apk
          echo "001fc241290931c7817c9db19d3e77ec0589b8dfa34d80429646ae077c86b43b  out/baseline-alpha1.apk" | sha256sum -c -
          echo "Pinned native engine preserved from the stable working Alpha1."

      - name: Verify isolated beta identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('os/android/app/build.gradle.kts').read_text()
          assert 'applicationId = "com.kasoncubillos.xhynivs26b3"' in gradle
          assert 'versionName   = "0.5.9.5-s26-beta3"' in gradle
          assert 'versionCode = 3' in gradle
          assert 'gta4_frame_limit", "30"' not in Path('os/android/app/src/main/java/com/libertyrecomp/S26GraphicsProfiles.java').read_text().replace('putIfAbsent("gta4_frame_limit", "30")','')
          print('Beta3 is isolated from existing games; code preserves the selected FPS setting.')
          PY

      - name: Test Spanish UI and police pursuit graphics profiles
        working-directory: os/android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Sign independent Beta3 APK with preserved Alpha1 native engine
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/s26-beta3-password.txt"
          chmod 600 "$RUNNER_TEMP/s26-beta3-password.txt"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/s26-beta3.p12" \
            -alias s26-beta3 -keyalg RSA -keysize 3072 -validity 365 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=XHYN IV S26 Beta3 independent, O=Personal Test, C=CL"
          unset PASSWORD
          python3 os/android/scripts/package_release.py \
            --native-apk out/baseline-alpha1.apk \
            --native-apk-sha256 001fc241290931c7817c9db19d3e77ec0589b8dfa34d80429646ae077c86b43b \
            --keystore "$RUNNER_TEMP/s26-beta3.p12" \
            --password-file "$RUNNER_TEMP/s26-beta3-password.txt" \
            --alias s26-beta3 \
            --output out/XHYN-IV-S26-Beta3-signed.apk
          sha256sum out/XHYN-IV-S26-Beta3-signed.apk | tee out/XHYN-IV-S26-Beta3-SHA256.txt
          rm -f "$RUNNER_TEMP/s26-beta3.p12" "$RUNNER_TEMP/s26-beta3-password.txt"

      - name: Preserve Beta3 installer in Actions
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-IV-S26-Beta3
          path: |
            out/XHYN-IV-S26-Beta3-signed.apk
            out/XHYN-IV-S26-Beta3-SHA256.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Publish direct-download experimental Beta3 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="out/XHYN-IV-S26-Beta3-signed.apk"
          test -s "$APK"
          if gh release view "s26-beta3" >/dev/null 2>&1; then
            gh release upload "s26-beta3" "$APK" --clobber
          else
            gh release create "s26-beta3" "$APK" \
              --target "$GITHUB_SHA" \
              --title "XHYN IV S26 Beta 3 — Luces y trafico" \
              --prerelease \
              --notes "Experimental Android Beta3 (com.kasoncubillos.xhynivs26b3). Main launcher and graphics settings translated to Spanish, optional Ultra Visual quality profile, user-selected FPS cap preserved. Uses the exact verified native ARM64 game/runtime from stable Alpha1. Full game data and native GTA IV textures are not included. Beta3 installs alongside Alpha1 and Beta2 due to different app IDs and signing keys. The user must provide their own legal game files and may need to import them again. Luces y trafico is an opt-in profile for police lights and dense traffic: 1080p native, SMAA Ultra, full-resolution reflections, environment reflection updates every second frame, two shader workers, caches and 10-second startup prewarm. Performance at 60 FPS has NOT been validated on-device."
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/s26-beta3/XHYN-IV-S26-Beta3-signed.apk" >> "$GITHUB_STEP_SUMMARY"
